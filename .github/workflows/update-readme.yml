name: Update README Timestamp

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Last Updated Timestamp
        run: |
          # Get current date in a readable format
          CURRENT_DATE=$(date -u +"%B %d, %Y %H:%M UTC")
          # Replace the timestamp placeholder in README.md
          sed -i "s/<!--LAST_UPDATED:.*-->/<!--LAST_UPDATED:${CURRENT_DATE}-->/" README.md
          sed -i "s|🕐 Last Updated:.*|🕐 Last Updated: **${CURRENT_DATE}**|" README.md

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: auto-update README timestamp [skip ci]"
          git push
